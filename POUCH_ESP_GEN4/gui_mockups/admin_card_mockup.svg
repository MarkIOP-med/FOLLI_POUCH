<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950">
  <rect width="900" height="950" rx="28" fill="#0f2030" stroke="#2f6d84" stroke-width="2"/>
  
  <text x="40" y="70" font-family="Segoe UI, Arial" font-size="30" font-weight="700" fill="#f5fbff">ADMIN ACTIONS</text>
  
  <!-- RESET ALL DEFAULTS -->
  <rect x="40" y="110" width="820" height="100" rx="16" fill="#c94c4c" stroke="#ad3c3c"/>
  <text x="430" y="155" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#ffffff">RESET ALL DEFAULTS</text>
  <text x="430" y="180" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#e6cccc">Reset administrative function</text>
  
  <!-- SET CURRENT AS DEFAULT -->
  <rect x="40" y="230" width="820" height="100" rx="16" fill="#2f7eb8" stroke="#1f5a8f"/>
  <text x="430" y="275" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#ffffff">SET CURRENT AS DEFAULT</text>
  <text x="430" y="300" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#b3d9ff">Set current collaborative functions</text>
  
  <!-- SET VIBRATION LEVELS MODAL -->
  <rect x="40" y="350" width="820" height="100" rx="16" fill="#365c74" stroke="#2f4f64"/>
  <text x="430" y="395" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#ffffff">SET VIBRATION LEVELS MODAL</text>
  <text x="430" y="420" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#8fd8ff">Set vibration levels modal</text>
  
  <!-- CHANGE DEFAULT VALUES MODAL -->
  <rect x="40" y="470" width="820" height="100" rx="16" fill="#365c74" stroke="#2f4f64"/>
  <text x="430" y="515" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="600" fill="#ffffff">CHANGE DEFAULT VALUES MODAL</text>
  <text x="430" y="540" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#8fd8ff">Change default values modal</text>
</svg>
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin and Vibration Cards</title>
    <style>
      body { margin: 0; background: #07121d; font-family: Segoe UI, Arial, sans-serif; color: #f4fbff; padding: 24px; }
      .container { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .frame { width: 100%; }
      img { width: 100%; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); }
      h2 { margin-top: 0; font-size: 18px; color: #8fd8ff; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="frame">
        <h2>Admin Card</h2>
        <img src="admin_card_mockup.svg" alt="Admin card mockup" />
      </div>
      <div class="frame">
        <h2>Vibration Card</h2>
        <img src="vibration_card_mockup.svg" alt="Vibration card mockup" />
      </div>
    </div>
  </body>
</html>
